<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0e12"><title>RR</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icons/favicon-32.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="RIFT RUNNER — аркадный шутер-выживание: двадцать волн, один оператор.">
</head>
<body>
<canvas id="game" data-i18n-aria="app.canvas"></canvas><div id="hurt"></div>
<div id="hud" class="hidden"><div class="top"><div><div class="brand"><span id="brand-a"></span><em id="brand-b"></em><span style="font-size:9px;letter-spacing:3px;font-weight:500;margin-left:13px;color:#82969e" data-i18n="hud.subtitle"></span></div><div class="health"><div class="label"><span data-i18n="hud.integrity"></span><span id="hptext"></span></div><div class="track"><i id="hpbar"></i></div><div class="label xp-label"><span id="lvltext"></span><span id="xptext"></span></div><div class="track xp"><i id="xpbar"></i></div></div></div><div class="top-center"><div id="wave"></div><div id="timer">20</div></div><div class="score-box"><strong id="score">000000</strong><small id="best"></small></div></div><div id="bossbar" class="hidden"><div class="label" id="bossname"></div><div class="track"><i id="bossfill"></i></div></div><div class="bottom"><div><div id="scrapbox"><span class="scrap-glyph">◆</span><b id="scrap">0</b><small data-i18n="hud.scrap"></small><em id="bonus"></em></div><div class="weapons" id="weapons"></div></div><div class="abilities"><div class="ability"><div class="label"><span data-i18n="hud.ability.dash"></span><span id="dashcharges"></span></div><div class="track"><i id="dashbar"></i></div></div><div class="ability"><div class="label" data-i18n="hud.ability.pulse"></div><div class="track"><i id="pulsebar"></i></div></div></div></div></div>
<div id="utility" class="utility hidden"><button id="sound" class="icon-btn" data-i18n-title="hud.sound.title"></button><button id="pause" class="icon-btn" data-i18n-title="hud.pause.title">Ⅱ</button></div>
<div id="toast"><b></b><span></span></div>
<div id="menu" class="overlay"><div class="panel"><div class="eyebrow" data-i18n="menu.eyebrow"></div><div class="hero"><div><h1><b id="title-a" style="font-weight:inherit"></b><br><span id="title-b"></span></h1><p class="intro" data-i18n="menu.intro"></p><div class="actions"><button id="start" class="primary" data-i18n="menu.start"></button><span class="sub" data-i18n="menu.sub"></span></div><div class="actions secondary"><button id="continue" class="ghost hidden"><span data-i18n="menu.continue"></span> <small id="continueinfo"></small></button><button id="menusettings" class="ghost" data-i18n="menu.settings"></button></div><p class="touch-only hint" data-i18n="menu.touchHint"></p></div><div class="legend"><h3 data-i18n="menu.legend"></h3>
<p><span class="key" data-i18n="menu.key.move"></span><span data-i18n="menu.legend.move"></span></p>
<p><span class="key" data-i18n="menu.key.mouse"></span><span data-i18n="menu.legend.mouse"></span></p>
<p><span class="key" data-i18n="menu.key.space"></span><span data-i18n="menu.legend.space"></span></p>
<p><span class="key" data-i18n="menu.key.pulse"></span><span data-i18n="menu.legend.pulse"></span></p>
<p><span class="key" data-i18n="menu.key.esc"></span><span data-i18n="menu.legend.esc"></span></p></div></div><div class="menu-footer"><span data-i18n="menu.footer"></span><span id="menubest"></span></div></div></div>
<div id="opselect" class="overlay hidden"><div class="panel center-panel ops-panel"><div class="eyebrow" data-i18n="ops.eyebrow"></div><h2 data-i18n="ops.title"></h2><div id="oplist" class="ops"></div><div id="threatbox" class="threatbox"></div><div class="row-actions"><button id="opback" class="ghost" data-i18n="ops.back"></button><button id="opgo" class="primary" data-i18n="ops.start"></button></div></div></div>
<div id="settings" class="overlay hidden"><div class="panel center-panel set-panel"><div class="eyebrow" data-i18n="set.eyebrow"></div><h2 data-i18n="set.title"></h2><div id="setlist" class="setlist"></div><button id="setdone" class="primary" data-i18n="set.done"></button><p class="hint" data-i18n="set.hint"></p></div></div>
<div id="pausemenu" class="overlay hidden"><div class="panel center-panel"><div class="eyebrow" data-i18n="pause.eyebrow"></div><h2 data-i18n="pause.title"></h2><p data-i18n="pause.text"></p><button id="resume" class="primary" data-i18n="pause.resume"></button><div class="row-actions"><button id="pausesettings" class="ghost" data-i18n="pause.settings"></button><button id="pausequit" class="ghost" data-i18n="pause.quit"></button></div><p class="hint" data-i18n="pause.quitHint"></p><div id="pausestats" class="statlist pause-stats"></div><p class="hint" data-i18n="pause.hint"></p></div></div>
<div id="upgrades" class="overlay hidden"><div class="panel center-panel"><div class="eyebrow" id="cleared"></div><h2 data-i18n="lvl.title"></h2><p id="lvltextinfo"></p><div id="cards" class="cards cards4"></div><div class="row-actions lvl-actions"><div class="term-scrap lvl-scrap"><span class="scrap-glyph">◆</span><b id="lvlscrap">0</b><small data-i18n="shop.scrap"></small></div><button id="reroll" class="ghost"></button></div><p class="hint" data-i18n="lvl.hint"></p></div></div>
<div id="shop" class="overlay shop hidden"><div class="term"><div class="term-head"><div><div class="eyebrow" id="shophead"></div><h2 data-i18n="shop.title"></h2></div><div class="term-scrap"><span class="scrap-glyph">◆</span><b id="shopscrap">0</b><small data-i18n="shop.scrap"></small></div></div><div class="term-body"><section class="term-offers"><div class="term-label" id="offerslabel"></div><div id="offers" class="offer-grid"></div><div class="term-actions"><button id="shopreroll" class="ghost"></button><button id="shopgo" class="primary" data-i18n="shop.go"></button></div><p class="hint" data-i18n="shop.hint"></p></section><aside class="term-side"><div class="term-label" id="arsenallabel"></div><div id="arsenal"></div><div class="term-label" id="modlabel"></div><div id="modlist"></div><div class="term-label" data-i18n="syn.title"></div><div id="synlist" class="synlist"></div><div class="term-label" data-i18n="shop.stats"></div><div id="statlist" class="statlist"></div></aside></div></div></div>
<div id="gameover" class="overlay hidden"><div class="panel center-panel"><div class="eyebrow" id="overeyebrow"></div><h2 id="overtitle"></h2><p id="recordmsg"></p><p class="hint" id="overdetail"></p><div id="endextra" class="endextra"></div><div class="stats"><div><strong id="finalscore">0</strong><small data-i18n="over.score"></small></div><div><strong id="finalwave">1</strong><small data-i18n="over.wave"></small></div><div><strong id="finalkills">0</strong><small data-i18n="over.kills"></small></div><div><strong id="finaltime">0:00</strong><small data-i18n="over.time"></small></div></div><div class="row-actions"><button id="tomenu" class="ghost" data-i18n="end.menu"></button><button id="restart" class="primary" data-i18n="over.restart"></button></div><p class="hint" data-i18n="over.hint"></p></div></div>
<div id="devpanel" class="hidden"></div>
<div id="touchcontrols" class="hidden"><div id="stick" class="touch-only"><div id="knob"></div></div><div class="touch-actions touch-only"><button id="touchdash" data-i18n="touch.dash"></button><button id="touchpulse" data-i18n="touch.pulse"></button><button id="touchfire" class="hidden" data-i18n="touch.fire"></button></div></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
